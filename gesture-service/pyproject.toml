# Tooling configuration for the Gesture Recognition Service (KAN-35).
# Install the tools with: pip install -r requirements-dev.txt

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.format]
line-ending = "auto"

[tool.ruff.lint]
# E4/E7/E9 + F: pycodestyle errors and pyflakes. I: import sorting.
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# Helper scripts adjust sys.path before importing project modules.
"scripts/*" = ["E402"]

[tool.mypy]
files = ["."]
exclude = [
    "^venv/",
    "^\\.venv/",
    "^data/",
    "^models/",
    # Offline dataset and training scripts, not part of the running service.
    "^scripts/(download_dataset|prepare_dataset|train_spoter|evaluate)\\.py$",
]
ignore_missing_imports = true

# Heavy or untyped ML libraries are treated as Any instead of being analysed.
[[tool.mypy.overrides]]
module = ["torch", "torch.*", "numpy", "numpy.*", "datasets", "datasets.*", "huggingface_hub", "huggingface_hub.*"]
follow_imports = "skip"
ignore_missing_imports = true

# Legacy SPOTER research code is not type checked.
[[tool.mypy.overrides]]
module = ["spoter", "spoter.*"]
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
